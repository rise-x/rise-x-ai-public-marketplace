name: Bug report
description: Report a problem with a plugin in this marketplace
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, please rule out tenant/account issues — see the
        support contact link. This form is for problems with a plugin itself
        (skills, MCP server connections, packaging).
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin?
      options:
        - rise-x-mcp
        - rise-x-apps
        - other / not listed
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: "2.1.217"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version of the plugin above that you have installed
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: mcp-server
    attributes:
      label: Which MCP server? (if the issue involves an MCP server connection)
      options:
        - rise-x-test
        - rise-x (production)
        - both
        - N/A / not server-related
        - other / not listed
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant error output. This will be rendered as shell output.
      render: shell
    validations:
      required: false
