name: release-pr

# Keeps the release PR (release/<name> -> main) open and its body current
# while a release is assembled, so the delta that will ship is always visible
# and merging that PR is the release.
#
# The body is regenerated on every push to the release branch by
# scripts/release-pr-body.sh: a per-plugin changelog with each plugin's
# version bump and the PRs merged into the branch, behind stable
# <!-- notes --> / <!-- changelog --> markers that release-notes tooling
# parses. Whatever a human writes in the notes block is preserved.
#
# A PR opened with GITHUB_TOKEN does not itself start validate.yml. Marking
# the PR ready for review does (validate listens for ready_for_review), and
# so does every later push to the branch, so the required check is present by
# the time anyone can merge.
#
# REQUIRES the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings -> Actions -> General -> Workflow permissions).
# Without it GitHub refuses the create call and no release PR ever appears —
# the step below says so explicitly rather than failing with a bare API error.

on:
  push:
    branches:
      - 'release/**'
  # Recovery path: re-run against a release branch after a transient failure,
  # or after enabling the Actions setting above. Dispatch it ON the release
  # branch — the branch is taken from the ref, not an input.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ensure-pr:
    name: Ensure release PR exists and is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the body generator reads each plugin's version from
          # origin/main and diffs the release delta against it.
          fetch-depth: 0

      - name: Open or refresh the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH" != release/* ]]; then
            echo "::error::this workflow must run on a release/* branch, not '$BRANCH'"
            exit 1
          fi

          # Fail closed: an empty count means the query did not answer, which
          # must not be read as "a PR already exists" (that would skip silently).
          open_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number)"
          open_count="$(printf '%s' "$open_json" | jq length)"
          if ! [[ "$open_count" =~ ^[0-9]+$ ]]; then
            echo "::error::could not determine whether a release PR is open (got '$open_count')"
            exit 1
          fi

          if [[ "$open_count" != "0" ]]; then
            number="$(printf '%s' "$open_json" | jq -r '.[0].number')"
            gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/current-body.md"
            bash scripts/release-pr-body.sh "$BRANCH" "$RUNNER_TEMP/current-body.md" > "$RUNNER_TEMP/pr-body.md"
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Refreshed the body of release PR #${number}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A branch that only merged main back in has nothing to PR yet.
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}" --jq .ahead_by)"
          if ! [[ "$ahead" =~ ^[0-9]+$ ]]; then
            echo "::error::could not compare main...${BRANCH} (got '$ahead')"
            exit 1
          fi
          if [[ "$ahead" == "0" ]]; then
            echo "${BRANCH} has no commits ahead of main; nothing to open yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          bash scripts/release-pr-body.sh "$BRANCH" > "$RUNNER_TEMP/pr-body.md"
          name="${BRANCH#release/}"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" \
                 --base main --head "$BRANCH" --draft \
                 --title "release: ${name}" \
                 --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::could not create the release PR. If the error mentions that GitHub Actions is not permitted to create pull requests, enable Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests', then re-run this workflow on ${BRANCH}. Otherwise open the PR by hand: gh pr create --base main --head ${BRANCH} --draft --title 'release: ${name}'"
            exit 1
          fi
          echo "Opened draft release PR for ${BRANCH}." >> "$GITHUB_STEP_SUMMARY"
